# Bgame - nginx site. Copy to /etc/nginx/sites-available/bgame, replace GAME_DOMAIN,
# link into sites-enabled, then run: sudo certbot --nginx -d GAME_DOMAIN
# The game is static files only: no PHP, no Node, no database on the server.

# at most 5 requests a second per address to the data server (bursts allowed)
limit_req_zone $binary_remote_addr zone=bgame_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name GAME_DOMAIN;

    # "current" is a symlink to the active release (see deploy/deploy.sh) - switching it is atomic.
    root /var/www/bgame/current;
    index index.html;

    charset utf-8;
    client_max_body_size 64k;         # only /api accepts bodies (see below)
    server_tokens off;

    # --- security headers (children's site) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # microphone: only for the optional voice note in "חכמים יותר"; everything else off
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    # scripts, styles and fonts only from this site (fonts are self-hosted); recordings are blob: URLs; React uses inline styles
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;

    # --- compression ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    # woff2 is already compressed, so it is not in the list

    # hashed build files never change: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # the entry page must always be fresh so a new version is picked up right away
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
    }

    # the data server (sealed container, unix socket only - see deploy/setup-api.sh).
    # If it is not installed, the game keeps working and saves on the device.
    location /api/ {
        limit_req zone=bgame_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 600k;
        proxy_pass http://unix:/srv/bgame-api/run/api.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 20s;
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # never serve hidden files (.git, .env) even if one ends up in a release by mistake
    location ~ /\. { deny all; return 404; }

    access_log /var/log/nginx/bgame.access.log;
    error_log  /var/log/nginx/bgame.error.log warn;
}
